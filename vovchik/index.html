<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Вовчик ебень</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      overflow: hidden;
      background: #00ff00;
      color: #ffeb00;
      font-family: Impact, Haettenschweiler, "Arial Black", sans-serif;
      text-align: center;
    }
    h1 {
      margin: 0;
      padding: 2vw;
      font-size: clamp(4rem, 16vw, 18rem);
      line-height: 0.9;
      font-weight: 900;
      letter-spacing: -0.04em;
      text-transform: uppercase;
      text-shadow: 5px 5px 0 #159b00;
      overflow-wrap: anywhere;
    }
  </style>
</head>
<body>
  <h1>Вовчик<br>ебень</h1>
</body>
</html>
